services:
  relay:
    build:
      context: .
      dockerfile: Dockerfile.relay
    restart: unless-stopped
    environment:
      AIPOOL_RELAY_ADDR: 0.0.0.0:8443
      AIPOOL_RELAY_CERT: /certs/relay.crt
      AIPOOL_RELAY_KEY: /certs/relay.key
      AIPOOL_RELAY_MAX_CONNECTIONS: 4096
      AIPOOL_RELAY_MAX_CONNECTIONS_PER_IP: 256
      AIPOOL_RELAY_MAX_CONNECTIONS_PER_PAIR: 512
      AIPOOL_RELAY_MAX_PENDING_PER_PAIR: 128
    volumes:
      - ./relay-certs:/certs:ro
    ports:
      - "8443:8443"
